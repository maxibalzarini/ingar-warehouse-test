name: INGAR temporary installer runtime assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingar-installer-assets.yml'

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download locked runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --fail --retry 3 -o out/node.exe https://nodejs.org/dist/v22.23.2/win-x64/node.exe
          curl -L --fail --retry 3 -o out/INGARWarehouseService.exe https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe
          echo "0d0f5e39f9f3d9587bc19f73eab3c2c9c4903fd02d6dbf9c853dd81b3d95fad4  out/node.exe" | sha256sum -c -
          echo "05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da  out/INGARWarehouseService.exe" | sha256sum -c -
          sha256sum out/node.exe out/INGARWarehouseService.exe > out/SHA256SUMS.txt
      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: ingar-installer-runtime-assets
          path: out/
          if-no-files-found: error
          retention-days: 1
